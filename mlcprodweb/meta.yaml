id:        "mlcremote"
name:      "MLCRemote"
version:   "1.3.4"
status:    "retired"
category:  "Development Tools"
license:   "MIT"
platforms:
  - Windows
  - macOS
  - Linux

github:    "https://github.com/mlechner911/mlcremote"
slogan_en: "MLCRemote is a retired all-in-one remote development environment. It has been superseded by MLCTerm."
slogan_de: "MLCRemote ist eine eingestellte All-in-One-Umgebung für die Remote-Entwicklung. Es wurde durch MLCTerm ersetzt."
openapi:   ""
screenshots:
  - "terminal.svg"

downloads:
  free: true
  windows: "MLCRemote-amd64-installer.exe"
  linux:   ""
  macos:   ""

features:
  - icon:     "zap"
    title_en: "Instant Access"
    title_de: "Sofortiger Zugriff"
    desc_en:  "Connect to any server in seconds with automatic remote agent deployment."
    desc_de:  "Verbindung zu jedem Server in Sekunden mit automatischer Bereitstellung des Remote-Agents."

  - icon:     "folder"
    title_en: "Rich File Manager"
    title_de: "Dateimanager"
    desc_en:  "Full file operations with Drag & Drop, context menus, and trash support."
    desc_de:  "Vollständige Dateioperationen mit Drag & Drop, Kontextmenüs und Papierkorb-Unterstützung."

  - icon:     "terminal"
    title_en: "Terminal & PTY"
    title_de: "Terminal & PTY"
    desc_en:  "Integrated, resize-aware SSH terminal with multi-tab support."
    desc_de:  "Integriertes, größenadaptives SSH-Terminal mit Multi-Tab-Unterstützung."

  - icon:     "activity"
    title_en: "Admin Tools"
    title_de: "Admin-Tools"
    desc_en:  "Monitor system health and manage processes with real-time stats."
    desc_de:  "Überwachung des Systemzustands und Prozessmanagement mit Echtzeit-Statistiken."

  - icon:     "eye"
    title_en: "Media Preview"
    title_de: "Medienvorschau"
    desc_en:  "View images, PDFs, Markdown, and listen to audio directly in the remote manager."
    desc_de:  "Bilder, PDFs, Markdown ansehen und Audio direkt im Remote-Manager anhören."

  - icon:     "shield"
    title_en: "Secure Tunneling"
    title_de: "Sicherer Tunnel"
    desc_en:  "All traffic flows through a secure SSH tunnel without opening extra ports."
    desc_de:  "Der gesamte Datenverkehr fließt durch einen sicheren SSH-Tunnel, ohne zusätzliche Ports zu öffnen."
